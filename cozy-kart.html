<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#e6f1e8"><title>Bubu &amp; Dudu · Cozy Kart</title>
 <link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/kart.css">
</head>
<body class="kart-page">
 <canvas id="world" aria-label="Cozy Kart 3D race. WASD or arrows to drive, Space to drift, E to use an item."></canvas>
 <header class="kart-hud hidden" id="hud">
  <div class="race-title"><b>COZY KART</b><span id="track-name"></span></div>
  <div class="race-stat"><small>POSITION</small><b id="position">4 / 4</b></div>
  <div class="race-stat"><small>LAP</small><b id="lap">1 / 3</b></div>
  <div class="race-stat"><small>TIME</small><b id="timer">0:00.0</b></div>
  <button id="pause" class="icon-button" aria-label="Pause race">Ⅱ</button>
 </header>
 <div class="kart-sound"><button id="mute" class="icon-button" aria-label="Mute sound" aria-pressed="false">♫</button><label>Volume <input id="volume" type="range" min="0" max="1" step="0.05" value="0.3"></label></div>
 <div class="race-bottom hidden" id="race-bottom"><div><b id="speed">0</b><small> km/h</small><div class="drift-meter"><span id="drift-fill"></span></div><small id="drift-label">Hold Space + steer to drift</small></div><button class="item-slot" id="item" aria-label="Use held item">♡<small>No item · E</small></button></div>
 <canvas id="minimap" class="hidden" width="180" height="150" aria-label="Track map showing the four racers"></canvas>
 <div id="countdown" class="countdown hidden" aria-live="polite"></div>
 <div id="toast" class="kart-toast hidden" role="status" aria-live="polite"></div>
 <div id="overlay" class="kart-overlay"><section class="card kart-card" id="panel" aria-label="Cozy Kart menu"></section></div>
 <div class="kart-touch hidden" id="touch" aria-label="Touch driving controls">
  <div class="touch-steering"><button data-hold="left" aria-label="Steer left">←</button><button data-hold="right" aria-label="Steer right">→</button></div>
  <div class="touch-driving"><button data-hold="brake" aria-label="Brake">Brake</button><button data-hold="drift" aria-label="Drift">Drift</button><button data-hold="throttle" class="gas" aria-label="Accelerate">Go!</button></div>
 </div>
 <noscript>Cozy Kart needs JavaScript enabled. <a href="index.html">Back to Arcade</a></noscript>
 <script src="vendor/three.min.js"></script>
  <script src="js/voices.js"></script>
 <script>window.SkyHop=window.SkyHop||{};</script>
 <script src="js/skyhop/characters.js"></script>
 <script src="js/kart/race.js"></script>
 <script src="js/kart/models.js"></script>
 <script src="js/kart/main.js"></script>
</body>
</html>
